plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.module'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.module'
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName '1.0'

        manifestPlaceholders = [
            xposedminversion: "101"
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
