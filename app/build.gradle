android {
    namespace 'com.example.module'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.module'
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }
}
